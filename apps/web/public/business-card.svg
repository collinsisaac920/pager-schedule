<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="600" viewBox="0 0 1050 600">
  <!-- Background -->
  <rect width="1050" height="600" rx="32" fill="#0F172A"/>

  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1050" height="600" rx="32" fill="url(#grid)" opacity="0.5"/>

  <!-- Accent line top -->
  <rect x="0" y="0" width="1050" height="4" rx="2" fill="#6366F1"/>

  <!-- Frequency bar logo (left side) -->
  <!-- Bar 1 -->
  <rect x="80" y="220" width="18" height="60" rx="4" fill="#6366F1" opacity="0.4"/>
  <!-- Bar 2 -->
  <rect x="106" y="200" width="18" height="80" rx="4" fill="#6366F1" opacity="0.6"/>
  <!-- Bar 3 -->
  <rect x="132" y="180" width="18" height="100" rx="4" fill="#6366F1" opacity="0.8"/>
  <!-- Bar 4 -->
  <rect x="158" y="195" width="18" height="85" rx="4" fill="#6366F1"/>
  <!-- Bar 5 -->
  <rect x="184" y="210" width="18" height="70" rx="4" fill="#6366F1" opacity="0.9"/>
  <!-- Bar 6 -->
  <rect x="210" y="225" width="18" height="55" rx="4" fill="#6366F1" opacity="0.7"/>
  <!-- Bar 7 -->
  <rect x="236" y="215" width="18" height="65" rx="4" fill="#6366F1" opacity="0.5"/>

  <!-- Brand name -->
  <text x="80" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" fill="#F8FAFC" letter-spacing="-1">Pager Schedule</text>

  <!-- Tagline -->
  <text x="82" y="378" font-family="system-ui, -apple-system, monospace" font-size="16" fill="#64748B" letter-spacing="2">SCHEDULING INFRASTRUCTURE</text>

  <!-- Divider -->
  <line x1="80" y1="410" x2="500" y2="410" stroke="#1E293B" stroke-width="1"/>

  <!-- Contact info -->
  <text x="80" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#94A3B8">pagerschedule.com</text>

  <!-- Privacy badge -->
  <rect x="80" y="470" width="220" height="32" rx="16" fill="#1E293B"/>
  <text x="100" y="491" font-family="monospace" font-size="13" fill="#6366F1">◎ zero tracking</text>

  <!-- QR code placeholder (right side) -->
  <rect x="820" y="180" width="160" height="160" rx="12" fill="#1E293B"/>
  <!-- QR inner pattern (decorative) -->
  <rect x="836" y="196" width="40" height="40" rx="4" fill="#6366F1" opacity="0.8"/>
  <rect x="884" y="196" width="40" height="40" rx="4" fill="#6366F1" opacity="0.4"/>
  <rect x="836" y="244" width="40" height="40" rx="4" fill="#6366F1" opacity="0.6"/>
  <rect x="884" y="244" width="40" height="40" rx="4" fill="#6366F1" opacity="0.9"/>
  <rect x="904" y="216" width="16" height="16" rx="2" fill="#6366F1" opacity="0.5"/>
  <rect x="856" y="216" width="16" height="16" rx="2" fill="#F8FAFC" opacity="0.3"/>
  <rect x="856" y="264" width="16" height="16" rx="2" fill="#F8FAFC" opacity="0.3"/>
  <text x="900" y="364" font-family="monospace" font-size="12" fill="#475569" text-anchor="middle">scan to book</text>

  <!-- Bottom tagline -->
  <text x="525" y="555" font-family="monospace" font-size="13" fill="#334155" text-anchor="middle" letter-spacing="3">PRIVACY-FIRST · OPEN SOURCE · SELF-HOSTABLE</text>
</svg>
